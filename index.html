<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schätzmeister</title>
<meta name="description" content="Schätzfragen-Spiel: Je näher du an der richtigen Antwort liegst, desto mehr Punkte. Funktioniert offline.">
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a44; --muted:#6b7280; --line:#e4ddd0;
  --accent:#e2683c; --accent-ink:#fff; --good:#2f9e6b; --mid:#d9a21b; --bad:#c2453a;
  --shadow:0 2px 0 rgba(31,42,68,.08), 0 8px 24px rgba(31,42,68,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#111726; --card:#1a2236; --ink:#eef0f6; --muted:#9aa3b5; --line:#2a3450;
    --accent:#f07a4d; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
}
:root[data-theme="dark"]{ --bg:#111726; --card:#1a2236; --ink:#eef0f6; --muted:#9aa3b5; --line:#2a3450;
  --accent:#f07a4d; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25); }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
main{width:100%;max-width:560px;min-width:0}
.card{min-width:0;overflow-wrap:break-word}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}
.logo{font-weight:800;font-size:1.25rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo b{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;box-shadow:var(--shadow)}
h1{font-size:1.9rem;line-height:1.15;letter-spacing:-.03em;margin:0 0 8px}
h2{font-size:1.3rem;line-height:1.3;margin:0 0 6px;letter-spacing:-.01em}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
p.lead{color:var(--muted);margin:0 0 20px}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-weight:650}
.btn{background:var(--accent);color:var(--accent-ink);width:100%}
.btn:active,.btn2:active{transform:translateY(1px)}
.btn2{background:transparent;color:var(--ink);border:1.5px solid var(--line);width:100%}
.btn2 .sub,.btn .sub{display:block;font-size:.78rem;font-weight:500;opacity:.75}
.stack{display:grid;gap:10px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-bottom:14px}
.tag{display:inline-block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);margin-bottom:6px}
.progress{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.inputwrap{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px;background:var(--bg)}
.inputwrap:focus-within{border-color:var(--accent)}
.inputwrap input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.3rem;padding:12px 14px;outline:none}
.inputwrap span{display:flex;align-items:center;padding:0 14px;color:var(--muted);font-weight:600;border-left:1px solid var(--line);white-space:nowrap}
.preview{min-height:1.5em;color:var(--muted);font-size:.9rem;margin:8px 2px 12px}
.preview.err{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips button{padding:6px 10px;font-size:.85rem;background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:8px;font-weight:600}
.linkbtn{background:none;border:0;padding:10px 0 0;color:var(--muted);font-weight:600;width:100%;text-align:center;font-size:.9rem}
.result{text-align:center;padding:6px 0 4px}
.points{font-size:3.2rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.verdict{font-weight:700;margin:6px 0 4px}
.lifelost{color:var(--bad);font-weight:700;font-size:.9rem;margin-bottom:12px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.cmp div{border:1px solid var(--line);border-radius:12px;padding:10px}
.cmp small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.cmp strong{font-size:1.05rem}
.note{color:var(--muted);font-size:.9rem;margin:0 0 16px}
.scale{position:relative;height:34px;margin:16px 4px 18px}
.scale .bar{position:absolute;top:15px;left:0;right:0;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--bad),var(--mid),var(--good),var(--mid),var(--bad))}
.scale .dot{position:absolute;top:8px;width:18px;height:18px;margin-left:-9px;border-radius:50%;border:3px solid var(--card)}
.scale .t{background:var(--ink)} .scale .g{background:var(--accent)}
.scale .lbl{position:absolute;top:24px;font-size:.7rem;color:var(--muted);transform:translateX(-50%)}
.list{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}
.list li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:8px 0;font-size:.92rem}
.list li span:first-child{color:var(--muted)}
.list b{white-space:nowrap}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 4px;cursor:pointer}
.tiles div{text-align:center;border:1px solid var(--line);border-radius:12px;padding:10px 4px}
.tiles strong{display:block;font-size:1.3rem}
.tiles small{color:var(--muted);font-size:.75rem}
select{font:inherit;width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.catbox{border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.catbox summary{padding:12px;cursor:pointer;font-size:1rem;list-style:none;display:flex;justify-content:space-between;gap:8px}
.catbox summary::-webkit-details-marker{display:none}
.catbox summary::after{content:'▾';color:var(--muted)}
.catbox[open] summary::after{content:'▴'}
.catact{display:flex;gap:8px;padding:0 12px 8px}
.catact button{padding:6px 10px;font-size:.8rem;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:9px}
.catlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px 8px;padding:0 12px 12px}
.catlist label{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:.92rem;min-width:0}
.catlist input{width:20px;height:20px;flex:none;accent-color:var(--accent)}
details{margin-top:18px;color:var(--muted);font-size:.9rem}
summary{cursor:pointer;font-weight:600}
.radar{width:100%;height:auto;display:block;margin:4px 0 8px}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .ring.outer{stroke-width:1.5}
.radar .spoke{stroke:var(--line);stroke-width:1}
.radar .area{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.radar .pt{fill:var(--accent);stroke:var(--card);stroke-width:2}
.radar .lbl{fill:var(--ink);font-size:19px;font-weight:650}
.radar .val{fill:var(--muted);font-size:17px;font-weight:500}
.radar .tick{fill:var(--muted);font-size:13px}
.insight{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px}
.insight div{border:1px solid var(--line);border-radius:12px;padding:10px}
.insight small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
.insight strong{font-size:1rem}
.cattbl{width:100%;border-collapse:collapse;font-size:.9rem;margin-bottom:6px}
.cattbl th{text-align:left;color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:0 6px 8px}
.cattbl th.n,.cattbl td.n{text-align:right;white-space:nowrap}
.cattbl td{padding:9px 6px;border-top:1px solid var(--line);vertical-align:middle}
.meter{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:5px}
.meter i{display:block;height:100%;border-radius:99px}
.empty{color:var(--muted);text-align:center;padding:16px 0}
.setting{margin-bottom:22px}
.setting > label{display:block;font-weight:650;margin-bottom:8px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;color:var(--muted);padding:9px 6px;border-radius:9px;font-weight:600;font-size:.92rem}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.about{color:var(--muted);font-size:.9rem;margin:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabbar .inner{display:flex;width:100%;max-width:560px}
.tabbar button{flex:1;min-width:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.66rem;font-weight:600;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabbar svg{width:22px;height:22px;flex:none}
.tabbar button.on{color:var(--accent)}
.inputwrap span:empty{display:none}
.best-worst{display:grid;gap:8px;margin:0 0 6px}
.best-worst div{border:1px solid var(--line);border-radius:12px;padding:10px;font-size:.9rem}
.best-worst small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.05em}
#statsBody .rhit,#statsBody tr[data-cat]{cursor:pointer}
#statsBody tr[data-cat]:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
#statsBody tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.radar .rhit.sel .lbl{fill:var(--accent)}
.radar .rhit.sel .val{fill:var(--accent)}
.cattbl td .chev{color:var(--muted);font-size:.8rem;margin-left:4px}
.hint{color:var(--muted);font-size:.85rem;text-align:center;margin:-4px 0 14px}
.detail{border:1.5px solid var(--accent);border-radius:16px;padding:14px 14px 10px;margin:4px 0 18px;scroll-margin-top:16px}
.detail-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.detail-head h3{margin:0;color:var(--ink);font-size:1.05rem;text-transform:none;letter-spacing:0}
.detail-head small{color:var(--muted)}
.detail-head button{background:none;border:0;color:var(--muted);font-size:1.2rem;padding:0 4px;line-height:1}
.catchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.catchips button{flex:none;padding:5px 10px;font-size:.8rem;border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:99px;font-weight:600}
.catchips button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.detail .insight{margin:0 0 12px}
.detail .insight strong{font-size:.95rem}
.chart-t{font-size:.78rem;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 4px}
.dist{width:100%;height:auto;display:block}
.dist text{font-family:inherit}
.legend{color:var(--muted);font-size:.78rem;margin:4px 0 0;line-height:1.4}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-220%);visibility:hidden;opacity:0;pointer-events:none;z-index:30;background:var(--card);border:1.5px solid var(--accent);
  box-shadow:0 10px 30px rgba(0,0,0,.18);border-radius:14px;padding:10px 16px;display:flex;gap:12px;align-items:center;transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .25s,visibility 0s .4s;max-width:calc(100% - 32px);width:max-content;cursor:pointer}
.toast.on{transform:translate(-50%,0);visibility:visible;opacity:1;pointer-events:auto;transition:transform .4s cubic-bezier(.2,.9,.3,1.2),opacity .2s,visibility 0s}
.toast .ti{font-size:1.8rem;line-height:1}
.toast small{display:block;color:var(--accent);font-weight:700;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em}
.toast b{font-size:.98rem}
.achsum{margin:0 0 16px}
.achsum .meter{height:8px;margin-top:6px}
.achgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media (min-width:560px){.achgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ach{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;row-gap:3px;align-items:start;align-content:start;min-width:0;overflow-wrap:break-word;hyphens:auto}
.ach > *{grid-column:2;min-width:0}
.ach .ai{grid-column:1;grid-row:1 / span 4;font-size:1.8rem;line-height:1.1;text-align:center}
.ach.locked .ai{filter:grayscale(1);opacity:.35}
.ach b{font-size:.92rem;line-height:1.25}
.ach p{margin:0;color:var(--muted);font-size:.78rem;line-height:1.35}
.ach.got{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 7%,transparent)}
.ach .meter{margin-top:4px}
.ach small{color:var(--muted);font-size:.74rem;margin-top:2px}
.btn2:disabled{opacity:.55;cursor:default}
.revnote{font-weight:650;font-size:.88rem;margin:2px 0 12px;color:var(--muted)}
.revnote.ok{color:var(--good)}
.anc{display:flex;gap:12px;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;align-items:flex-start}
.anc .ai{font-size:1.6rem;line-height:1.1;flex:none;width:32px;text-align:center}
.anc small{display:block;color:var(--muted);font-size:.78rem;font-weight:600}
.anc .av{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.anc p{margin:3px 0 0;color:var(--muted);font-size:.82rem;line-height:1.4}
.anc.locked .ai{filter:grayscale(1);opacity:.35}
.anc.got{border-color:color-mix(in srgb,var(--accent) 45%,var(--line));background:color-mix(in srgb,var(--accent) 7%,transparent)}
.lessons{display:grid;gap:10px}
.lcard{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px;background:none;width:100%;text-align:left;color:var(--ink);font:inherit;font-weight:400}
.lcard .ln{flex:none;width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--accent) 12%,transparent);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.lcard b{display:block;font-size:.98rem;font-weight:700}
.lcard small{color:var(--muted);font-size:.8rem;line-height:1.35;display:block}
.lcard .ld{margin-left:auto;flex:none;font-size:.8rem;font-weight:700}
.lesson p{line-height:1.6;margin:0 0 12px}
.lbox{border-radius:14px;padding:12px 14px;margin:16px 0;border:1px solid var(--line)}
.lbox.ex{background:color-mix(in srgb,var(--good) 7%,transparent);border-color:color-mix(in srgb,var(--good) 30%,var(--line))}
.lbox.pr{border:1.5px solid var(--accent)}
.lbox .lb-t{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.lbox ol{margin:0;padding-left:20px}
.lbox li{margin:5px 0;font-size:.93rem;line-height:1.45}
.lq{font-weight:700;font-size:1.05rem;margin:0 0 6px}
.bounds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 6px}
.inputwrap.small{margin-top:0}
.inputwrap.small input{font-size:.95rem;padding:9px 10px}
.gm{font-size:.85rem;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.gm button{flex:none;padding:6px 10px;font-size:.8rem;border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:9px}
.gm button:disabled{opacity:.45}
.lres{margin-top:14px;scroll-margin-top:16px}
.sol{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.9rem;line-height:1.55;margin:4px 0 14px}
.back{background:none;border:0;color:var(--muted);font-weight:650;padding:0 0 12px;font-size:.9rem}
.hidden{display:none!important}
#bQuit{margin-top:18px;padding-top:10px;padding-bottom:10px}
#bStop{margin-top:14px}
.cmptbl{width:100%;border-collapse:collapse;font-size:.86rem;margin:4px 0 8px;table-layout:fixed}
.cmptbl th:first-child{width:36%}
.cmptbl th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;padding:0 6px 6px;text-align:right}
.cmptbl th:first-child,.cmptbl td:first-child{text-align:left;padding-left:0}
.cmptbl td{padding:8px 4px;border-top:1px solid var(--line);text-align:right;overflow-wrap:break-word;vertical-align:top}
.cmptbl td:first-child{white-space:normal;color:var(--muted)}
.cmptbl td b.up{color:var(--good)} .cmptbl td b.down{color:var(--bad)}
.timer{position:relative;height:26px;border-radius:9px;background:var(--line);overflow:hidden;margin:2px 0 14px}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--good);border-radius:9px;transition:width .1s linear,background .3s}
.timer.warn i{background:var(--mid)}
.timer.crit i{background:var(--bad)}
.timer span{position:relative;display:flex;align-items:center;justify-content:center;height:100%;font-size:.82rem;font-weight:750;color:var(--ink);font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" id="logo">📏 <span id="brand"></span></div>
  </header>

  <!-- Start -->
  <section id="vStart" class="card">
    <h1 data-i18n="heroTitle"></h1>
    <p class="lead" data-i18n="heroLead"></p>
    <div class="stack">
      <button class="btn" id="bDaily"></button>
      <button class="btn2" id="bRound"></button>
      <button class="btn2" id="bEndless"></button>
      <button class="btn2" id="bSurvival"></button>
      <button class="btn2" id="bBlitz"></button>
      <button class="btn2" id="bReview"></button>
      <details class="catbox" id="catBox">
        <summary id="catSum"></summary>
        <div class="catact"><button type="button" id="catAll"></button><button type="button" id="catNone"></button></div>
        <div class="catlist" id="catList"></div>
      </details>
    </div>
    <div class="tiles" id="tiles"></div>
    <details>
      <summary data-i18n="howTitle"></summary>
      <div id="howText"></div>
    </details>
  </section>

  <!-- Frage -->
  <section id="vQ" class="card hidden">
    <div class="meta"><span id="qNum"></span><span id="qScore"></span></div>
    <div class="progress" id="progWrap"><i id="prog"></i></div>
    <div class="timer hidden" id="timer"><i id="timerBar"></i><span id="timerTxt"></span></div>
    <div class="tag" id="qCat"></div>
    <h2 id="qText"></h2>
    <form id="form" autocomplete="off">
      <div class="inputwrap">
        <input id="guess" inputmode="decimal">
        <span id="qUnit"></span>
      </div>
      <div class="chips" id="chips"></div>
      <div class="preview" id="preview">&nbsp;</div>
      <button class="btn" type="submit" data-i18n="submit"></button>
    </form>
    <button class="linkbtn" id="bQuit"></button>
  </section>

  <!-- Auflösung -->
  <section id="vA" class="card hidden">
    <div class="meta"><span id="aNum"></span><span id="aScore"></span></div>
    <div class="result">
      <div class="points" id="aPts"></div>
      <div class="verdict" id="aVerdict"></div>
      <div class="lifelost hidden" id="aLife"></div>
      <div class="revnote hidden" id="aRev"></div>
    </div>
    <div class="scale" id="scale"></div>
    <div class="cmp">
      <div><small data-i18n="yourGuess"></small><strong id="aGuess"></strong></div>
      <div><small data-i18n="correct"></small><strong id="aTrue"></strong></div>
    </div>
    <p class="note" id="aNote"></p>
    <button class="btn" id="bNext"></button>
    <button class="linkbtn hidden" id="bStop"></button>
  </section>

  <!-- Ende -->
  <section id="vEnd" class="card hidden">
    <h1 id="eTitle"></h1>
    <p class="lead" id="eSub"></p>
    <div id="eStats"></div>
    <h3 id="eListH" class="hidden"></h3>
    <ul class="list" id="eList"></ul>
    <div class="stack">
      <button class="btn" id="bShare"></button>
      <button class="btn2" id="bAgain"></button>
    </div>
  </section>

  <!-- Statistik -->
  <section id="vLearn" class="card hidden">
    <h1 id="learnH"></h1>
    <div id="learnBody"></div>
  </section>

  <section id="vStats" class="card hidden">
    <h1 data-i18n="statsTitle"></h1>
    <p class="lead" data-i18n="statsLead"></p>

  const e = (typeof QUESTIONS_EN !== 'undefined' && QUESTIONS_EN[i]) || [q[1], q[3], q[4]];
  return {id:i, cat:q[0], answer:q[2], de:{text:q[1], unit:q[3], note:q[4]||''}, en:{text:e[0], unit:e[1], note:e[2]||''}};
});
const L = q => q[settings.lang];
const cats = [...new Set(Q.map(q=>q.cat))];
// Ausgewählte Kategorien für Freies Spiel, Endlos- und Überlebensmodus (standardmäßig alle)
let catSel = (() => {
  let a = store.get('catSel', null);
  if(!Array.isArray(a)){ const old = store.get('cat', ''); a = old ? [old] : cats; }
  return new Set(a.filter(c => cats.includes(c)));
})();
function saveCatSel(){ store.set('catSel', [...catSel]); }

/* ── Zahlen lesen & schreiben ── */
const SUFFIX = {
  de: [[/^(k|tsd\.?|tausend)$/,1e3],[/^(mio\.?|million(en)?)$/,1e6],[/^(mrd\.?|milliarde(n)?)$/,1e9],
       [/^(bio\.?|billion(en)?)$/,1e12],[/^(brd\.?|billiarde(n)?)$/,1e15],[/^(trio\.?|trillion(en)?)$/,1e18]],
  en: [[/^(k|thousand)$/,1e3],[/^(m|mn|mio|mil|millions?)$/,1e6],[/^(b|bn|billions?)$/,1e9],
       [/^(t|tn|trillions?)$/,1e12],[/^(quadrillions?)$/,1e15],[/^(quintillions?)$/,1e18]]
};
function parseNum(raw){
  let s = raw.trim().toLowerCase().replace(/[’' ]/g,'').replace(/×\s*10\^?/g,'e').replace(/\*\s*10\^/g,'e');
  if(!s) return null;
  const m = s.match(/^([0-9.,e+\-\s]+?)\s*([a-zäöü.]+)?$/);
  if(!m) return NaN;
  let n = m[1].replace(/\s/g,''), suf = m[2], mult = 1;
  if(suf){ const hit = SUFFIX[settings.lang].find(([re]) => re.test(suf)); if(!hit) return NaN; mult = hit[1]; }
  if(settings.lang === 'en') n = n.replace(/,/g,'');
  else if(n.includes('.') && n.includes(',')) n = n.replace(/\./g,'').replace(',', '.');
  else if(n.includes(',')) n = n.replace(',', '.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(n)) n = n.replace(/\./g,'');
  if(/e$/.test(n)) return NaN;
  const v = Number(n) * mult;
  return isFinite(v) ? v : NaN;
}
const nf = d => new Intl.NumberFormat(t('locale'),{maximumSignificantDigits:d});
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
function fmt(v){
  const a = Math.abs(v);
  if(a >= 1e21 || (a > 0 && a < 1e-3)){
    const e = Math.floor(Math.log10(a)), m = v / 10**e;
    return nf(3).format(m) + ' × 10' + String(e).split('').map(c=>SUP[c]).join('');
  }
  for(const [b,w] of t('words')) if(a >= b) return nf(3).format(v/b) + ' ' + w;
  return nf(6).format(v);
}

/* ── Wertung ── */
function score(guess, ans){
  if(!(guess > 0)) return {pts:0, factor:Infinity, high:false};
  const e = Math.abs(Math.log10(guess/ans));
  return {pts: Math.round(100 * Math.pow(Math.max(0, 1 - e/2), 1.5)), factor: 10**e, high: guess > ans};
}
function verdict(r){
  if(r.factor < 1.05) return t('bullseye');
  const f = r.factor < 10 ? nf(2).format(r.factor) : fmt(Math.round(r.factor));
  const pre = r.pts >= 85 ? t('vClose') : r.pts >= 60 ? t('vGood') : r.pts >= 30 ? t('vOff') : t('vFar');
  const fac = settings.lang === 'en' ? `${f}× ` : `Faktor ${f} `;
  return pre + fac + (r.high ? t('high') : t('low'));
}
const color = p => p >= 75 ? 'var(--good)' : p >= 40 ? 'var(--mid)' : 'var(--bad)';

/* ── Zufall ── */
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r=Math.random){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const dkey = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today = () => dkey(new Date());
const hash = s => [...s].reduce((h,c) => Math.imul(h ^ c.charCodeAt(0), 16777619), 2166136261);

/* ── Ansichten & Tabs ── */
const PLAY_VIEWS = ['vStart','vQ','vA','vEnd'];
let playView = 'vStart', game = null;
function show(id){
  for(const v of [...PLAY_VIEWS,'vLearn','vStats','vAch','vSettings']) $(v).classList.toggle('hidden', v !== id);
  if(PLAY_VIEWS.includes(id)){ playView = id; setTab('play'); }
  window.scrollTo(0,0);
}
function setTab(name){ document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === name)); }
function renderPlay(){
  if(!game || playView === 'vStart') return home();
  if(playView === 'vQ') return ask(true);
  if(playView === 'vA') return renderAnswer();
  home();
}

/* ── Spielstart ── */
function startDaily(){
  settleOpenGame();
  const key = today(), done = store.get('daily', {});
  const qs = shuffle(Q, rng(hash('sm'+key))).slice(0,5);
  game = {mode:'daily', key, qs, i:0, results:[]};
  if(done[key]){ game.results = done[key]; game.done = true; game.already = true; return renderEnd(); }
  const prog = store.get('dailyProg', null);
  if(prog && prog.key === key && Array.isArray(prog.results) && prog.results.length < qs.length){
    game.results = prog.results; game.i = prog.results.length;
  }
  ask();
}
function poolFor(){ return catSel.size >= cats.length ? Q : Q.filter(q => catSel.has(q.cat)); }
function startRound(){
  if(!poolFor().length) return;
  settleOpenGame();
  const pool = poolFor(), n = Math.min(settings.roundLen, pool.length);
  const seen = new Set(store.get('seen', []));
  let fresh = pool.filter(q => !seen.has(q.id));
  if(fresh.length < n){ store.set('seen', [...seen].filter(id => !pool.some(q => q.id === id))); fresh = pool; }
  game = {mode:'round', qs: shuffle(fresh).slice(0, n), i:0, results:[]};
  ask();
}
function startBlitz(){
  if(!poolFor().length) return;
  settleOpenGame();
  game = {mode:'blitz', qs: shuffle(poolFor()).slice(0, BLITZ_N), i:0, results:[]};
  ask();
}
const isOpen = () => game && (game.mode === 'endless' || game.mode === 'survival');
function startEndless(survival){
  if(!poolFor().length) return;
  settleOpenGame();
  const base = poolFor();
  game = {mode: survival ? 'survival' : 'endless', base, pool: shuffle(base), qs:[], i:0, results:[], lives: survival ? LIVES : 0};
  fillEndless(); ask();
}
function fillEndless(){
  if(game.i < game.qs.length) return;
  if(!game.pool.length) game.pool = shuffle(game.base);
  game.qs.push(game.pool.pop());
}
const total = () => game.results.reduce((s,r)=>s+r.pts,0);
const hearts = () => '❤️'.repeat(Math.max(0,game.lives)) + '🤍'.repeat(LIVES - Math.max(0,game.lives));

/* ── Frage ── */
function ask(keep){
  const q = game.qs[game.i], endless = isOpen();
  $('qNum').textContent = endless ? t('qN', game.i+1) : t('qOf', game.i+1, game.qs.length);
  $('qScore').textContent = (game.mode === 'survival' ? hearts() + '  ' : '') + t('pts', total());
  $('progWrap').classList.toggle('hidden', endless);
  if(!endless) $('prog').style.width = (game.i/game.qs.length*100)+'%';
  $('qCat').textContent = catName(q.cat);
  $('qText').textContent = L(q).text;
  $('qUnit').textContent = L(q).unit;
  $('guess').placeholder = t('placeholder');
  $('chips').innerHTML = t('chips').map(([l,s]) => `<button type="button" data-s="${s}">${l}</button>`).join('');
  $('bQuit').textContent = game.mode === 'endless' ? t('quitEndless') : game.mode === 'survival' ? t('quitSurvival') : t('quitRound');
  if(!keep) $('guess').value = '';
  const blitz = game.mode === 'blitz';
  $('timer').classList.toggle('hidden', !blitz);
  if(blitz && (!keep || !game.deadline)){ game.qStart = Date.now(); game.deadline = game.qStart + settings.blitzSec * 1000; }
  show('vQ');
  if(blitz) blitzTick();
  updatePreview();
  if(!keep) setTimeout(() => $('guess').focus(), 50);
}
function updatePreview(){
  if(!game || !game.qs[game.i]) return;
  const v = parseNum($('guess').value), p = $('preview');
  p.classList.remove('err');
  if(v === null) p.innerHTML = '&nbsp;';
  else if(isNaN(v) || v <= 0){ p.textContent = t('errPos'); p.classList.add('err'); }
  else p.textContent = '= ' + fmt(v) + ' ' + L(game.qs[game.i]).unit;
}
function submit(e){
  e.preventDefault();
  if(!game || game.answered === game.i) return;
  const v = parseNum($('guess').value);
  if(!(v > 0)){ updatePreview(); const p = $('preview'); p.classList.add('err'); if(v === null) p.textContent = t('errEmpty'); return; }
  answer(v);
}
/* ── Blitz-Uhr ── */
function blitzTick(){
  if(!game || game.mode !== 'blitz' || game.done || !game.deadline || $('vQ').classList.contains('hidden')) return;
  const left = Math.max(0, game.deadline - Date.now()), frac = left / (settings.blitzSec * 1000);
  $('timerBar').style.width = (frac * 100) + '%';
  $('timerTxt').textContent = t('secs', Math.ceil(left / 100) / 10);
  $('timer').className = 'timer' + (frac <= .2 ? ' crit' : frac <= .45 ? ' warn' : '');
  if(left <= 0){ const v = parseNum($('guess').value); answer(v > 0 ? v : null, true); }
}
setInterval(blitzTick, 100);
function answer(v, auto){
  const q = game.qs[game.i], to = v == null, r = to ? {pts:0, factor:Infinity, high:false} : score(v, q.answer);
  game.answered = game.i;
  let secs = null;
  if(game.mode === 'blitz'){ secs = Math.min(settings.blitzSec, (Date.now() - game.qStart) / 1000); game.deadline = null; }
  const res = {id:q.id, guess: to ? 0 : v, pts:r.pts};
  if(to) res.to = 1;
  if(secs != null) res.s = Math.round(secs * 10) / 10;
  game.results.push(res);
  let lifeLost = false;
  if(game.mode === 'survival' && r.pts < LIFE_THRESHOLD){ game.lives--; lifeLost = true; }
  game.last = {q, v, r, lifeLost, to, auto: auto && !to, secs};
  if(to){
    const p = loadProg(); p.good = 0; p.hit = 0; saveProg(p);
    saveActive(); renderAnswer(); return;
  }
  if(game.mode === 'round'){ const s = store.get('seen', []); s.push(q.id); store.set('seen', s); }
  const cs = store.get('cats', {}), c = cs[q.cat] || {n:0, sum:0, best:0, hits:0, close:0, high:0};
  c.n++; c.sum += r.pts; c.best = Math.max(c.best, r.pts);
  if(r.factor < 1.05) c.hits++;
  if(r.factor <= 2) c.close++;
  if(r.high) c.high++;
  cs[q.cat] = c; store.set('cats', cs);
  logAnswer(q.cat, v, q.answer, r.pts, q.id, secs);
  game.last.rev = updateRev(q.id, r.pts);
  if(game.mode === 'review' && game.last.rev === 'mastered') game.mastered = (game.mastered || 0) + 1;
  unlockAnchors(q.id, r.pts);
  saveActive();
  trackAnswer(v, r);
  renderAnswer();
  checkAch();
}
function renderAnswer(){
  const {q, v, r, lifeLost, to, auto, secs} = game.last, endless = isOpen();
  $('aNum').textContent = endless ? t('qN', game.i+1) : t('qOf', game.i+1, game.qs.length);
  $('aScore').textContent = (game.mode === 'survival' ? hearts() + '  ' : '') + t('pts', total());
  $('aPts').textContent = '+' + r.pts; $('aPts').style.color = color(r.pts);
  $('aVerdict').textContent = to ? t('timeUp') : verdict(r) + (auto ? t('autoSub') : secs != null ? t('inTime', secs) : '');
  $('aLife').textContent = lifeLost ? t('lifeLost', game.lives) : '';
  $('aLife').classList.toggle('hidden', !lifeLost);
  const rv = game.last.rev, rvKey = {added:'revAdded', progress:'revProgress', mastered:'revMastered', again:'revAgain'}[rv];
  $('aRev').textContent = rvKey ? t(rvKey) : '';
  $('aRev').className = 'revnote' + (rvKey ? '' : ' hidden') + (rv === 'progress' || rv === 'mastered' ? ' ok' : '');
  $('aGuess').textContent = to ? '–' : fmt(v) + ' ' + L(q).unit;
  $('aTrue').textContent = fmt(q.answer) + ' ' + L(q).unit;
  $('aNote').textContent = L(q).note; $('aNote').classList.toggle('hidden', !L(q).note);
  drawScale(to ? null : v, q.answer);
  const last = game.mode === 'survival' ? game.lives <= 0 : game.mode === 'endless' ? false : game.i+1 >= game.qs.length;
  $('bNext').textContent = last ? t('toResult') : t('next');
  $('bStop').textContent = game.mode === 'survival' ? t('quitSurvival') : t('stop');
  $('bStop').classList.toggle('hidden', !endless || last);
  show('vA'); $('bNext').focus();
}
function drawScale(g, a){
  const pos = x => 50 + Math.max(-2, Math.min(2, Math.log10(x/a))) * 25;
  $('scale').innerHTML = `<div class="bar"></div>
    <span class="lbl" style="left:0%">÷100</span><span class="lbl" style="left:25%">÷10</span>
    <span class="lbl" style="left:75%">×10</span><span class="lbl" style="left:100%">×100</span>
    <div class="dot t" style="left:50%"></div>${g == null ? '' : `<div class="dot g" style="left:${pos(g)}%"></div>`}`;
}
function next(){
  if(isOpen()){
    if(game.mode === 'survival' && game.lives <= 0) return finish();
    game.i++; fillEndless(); return ask();
  }
  game.i++; game.i < game.qs.length ? ask() : finish();
}
function quit(){
  if(isOpen() && game.results.length) return finish();
  settleOpenGame();
  game = null; home();
}

/* ── Ende ── */
const STATS0 = {games:0, sum:0, best:0, streak:0, last:''};
const fin = x => Number.isFinite(x) ? x : 0;
function loadStats(){
  const st = store.get('stats', STATS0);
  for(const k of ['games','sum','best','streak']) st[k] = fin(st[k]);
  return st;
}
// Wertet ein Spiel genau einmal in der Gesamtstatistik
function commitStats(g){
  const res = g.results || [], n = res.length;
  if(!n) return {};
  const tot = res.reduce((s,r)=>s+r.pts,0), out = {};
  const st = loadStats();
  st.games++; st.sum += tot / n;
  if(g.mode !== 'endless') st.best = Math.max(st.best, Math.round(tot / n));
  if(g.mode === 'daily'){
    const d = store.get('daily', {}); d[g.key] = res; store.set('daily', d);
    const yk = dkey(new Date(Date.now()-864e5));
    if(st.last !== g.key){ st.streak = st.last === yk ? st.streak + 1 : 1; st.last = g.key; }
    store.set('dailyProg', null);
  } else store.set('active', null);
  if(g.mode === 'blitz'){
    const bz = store.get('blitz', {best:0, games:0});
    bz.games = fin(bz.games) + 1;
    bz.n = fin(bz.n) + n; bz.to = fin(bz.to) + res.filter(r => r.to).length;
    bz.secs = fin(bz.secs) + res.reduce((a, r) => a + (r.s != null ? r.s : 0), 0);
    out.prevBest = fin(bz.best);
    if(tot > fin(bz.best)){ bz.best = tot; if(out.prevBest) out.record = true; }
    store.set('blitz', bz);
  }
  if(g.mode === 'survival'){
    const en = store.get('endless', {best:0, bestN:0, games:0});
    en.games = fin(en.games) + 1;
    if(tot > fin(en.best)){ en.best = tot; en.bestN = n; out.record = true; }
    out.prevBest = en.best;
    store.set('endless', en);
  }
  store.set('stats', st);
  const pr = loadProg();
  pr.bestStreak = Math.max(pr.bestStreak, st.streak);
  if((g.mode === 'round' || g.mode === 'daily') && n >= 5 && res.every(r => r.pts >= 75)) pr.perfect++;
  if(g.mode === 'blitz'){
    pr.blitzBest = Math.max(pr.blitzBest, tot);
    if(n >= BLITZ_N){ pr.blitzGames++; if(res.every(r => !r.to)) pr.blitzClean++; }
  }
  saveProg(pr);
  return out;
}
function finish(){
  if(game.done) return renderEnd();
  Object.assign(game, commitStats(game));
  game.done = true;
  renderEnd();
  checkAch();
}
// Spielstand nach jeder Antwort sichern (überlebt Neuladen und Tabwechsel)
function saveActive(){
  if(!game || game.done) return;
  if(game.mode === 'daily') store.set('dailyProg', {key: game.key, results: game.results});
  else store.set('active', {mode: game.mode, results: game.results});
}
// Ein angefangenes Spiel (nicht Tagesrätsel) zählen, bevor ein neues beginnt
function settleOpenGame(){
  if(game && !game.done && game.mode !== 'daily' && game.results.length){ commitStats(game); game.done = true; }
}
// Beim Start: Spiele werten, die beim letzten Mal nicht beendet wurden
function recoverOpenGames(){
  const a = store.get('active', null);
  if(a && Array.isArray(a.results) && a.results.length) commitStats({mode: a.mode, results: a.results});
  store.set('active', null);
  const dp = store.get('dailyProg', null);
  if(dp && dp.key !== today() && Array.isArray(dp.results) && dp.results.length){
    commitStats({mode: 'round', results: dp.results}); store.set('dailyProg', null);
  }
  const st = store.get('stats', null);
  if(st) store.set('stats', loadStats());
}
function renderEnd(){
  const n = game.results.length, tot = total(), pct = tot / (n*100);
  $('eStats').innerHTML = ''; $('eListH').classList.add('hidden');
  if(game.mode === 'survival'){
    $('eTitle').textContent = t('pts', tot);
    $('eSub').textContent = t('gameOver', n) + (game.record ? t('newRecord') : t('record', game.prevBest));
  } else if(game.mode === 'endless'){
    $('eTitle').textContent = t('pts', tot);
    $('eSub').textContent = t('sessionSub', n, Math.round(tot/n));
    $('eStats').innerHTML = sessionStats();
    $('eListH').textContent = t('yourAnswers'); $('eListH').classList.remove('hidden');
  } else {
    if(game.mode === 'blitz') $('eStats').innerHTML = blitzRoundStats();
    $('eTitle').textContent = t('outOf', tot, n*100);
    $('eSub').textContent = (game.already ? t('already') : '') + (pct >= .8 ? t('r80') : pct >= .6 ? t('r60') : pct >= .4 ? t('r40') : t('r0')) + (game.mode === 'review' ? t('revEnd', game.mastered || 0, revDeck().length) : '')
      + (game.mode === 'blitz' ? t('blitzEnd', game.results.reduce((a, r) => a + (r.s || 0), 0) / n, game.results.filter(r => r.to).length)
         + (game.record ? t('newRecord') : game.prevBest ? t('record', game.prevBest) : '') : '');
  }
  $('eList').innerHTML = game.results.map(r => {
    const q = Q[r.id];
    return `<li><span>${L(q).text}<br><small>${r.to ? t('timeUpShort') : `${t('you')}: ${fmt(r.guess)}`} · ${t('right')}: ${fmt(q.answer)} ${L(q).unit}${r.s != null && !r.to ? ' · ' + t('secs', r.s) : ''}</small></span><b style="color:${color(r.pts)}">${r.pts}</b></li>`;
  }).join('');
  $('bShare').textContent = t('share');
  $('bAgain').textContent = game.mode === 'daily' ? t('startFree') : t('again');
  show('vEnd');
}
function share(){
  const sq = p => p >= 75 ? '🟩' : p >= 40 ? '🟨' : '🟥';
  const head = game.mode === 'daily' ? `${t('name')} ${game.key}: ${total()}/${game.qs.length*100}`
    : isOpen() ? `${t('name')} ${game.mode === 'survival' ? '❤️' : '∞'}: ${t('pts', total())} (${t('nQ', game.results.length)})`
    : game.mode === 'blitz' ? `${t('name')} ⚡: ${total()}/${game.results.length*100}`
    : `${t('name')}: ${total()}/${game.results.length*100}`;
  const txt = `${head}\n${game.results.map(r=>sq(r.pts)).join('')}\n${location.href.split('#')[0]}`;
  if(navigator.share) navigator.share({text:txt}).catch(()=>{});
  else navigator.clipboard?.writeText(txt).then(() => { $('bShare').textContent = t('copied'); setTimeout(()=>$('bShare').textContent=t('share'),1500); });
}

function sessionStats(){
  const res = game.results.map(r => ({...r, q: Q[r.id], s: score(r.guess, Q[r.id].answer)}));
  const n = res.length, by = {};
  res.forEach(r => { const b = by[r.q.cat] || (by[r.q.cat] = {n:0, sum:0}); b.n++; b.sum += r.pts; });
  const data = cats.map(cat => ({cat, avg: by[cat] ? Math.round(by[cat].sum / by[cat].n) : null}));
  const played = data.filter(d => d.avg != null).sort((a,b) => b.avg - a.avg);
  const close = res.filter(r => r.s.factor <= 2).length, hits = res.filter(r => r.s.factor < 1.05).length;
  const hi = res.filter(r => r.s.high).length / n;
  const tend = Math.abs(hi - .5) < .1 ? t('balanced') : hi > .5 ? t('tooHigh', Math.round(hi*100)) : t('tooLow', Math.round((1-hi)*100));
  const best = res.reduce((a,b) => b.s.factor < a.s.factor ? b : a), worst = res.reduce((a,b) => b.s.factor > a.s.factor ? b : a);
  const line = r => `${L(r.q).text}<br><small style="text-transform:none;letter-spacing:0">${t('you')}: ${fmt(r.guess)} · ${t('right')}: ${fmt(r.q.answer)} ${L(r.q).unit} · <b style="color:${color(r.pts)}">${r.pts}</b></small>`;
  let h = `<div class="insight">

function barChart(items, opt){

  if(opt.max) s += `<text x="${r}" y="${top - 5}" font-size="9" fill="var(--muted)" text-anchor="end">${opt.max}</text>`;
  items.forEach((it, i) => {
    const x = l + i*bw + gap/2, w = bw - gap, h = Math.max(it.h > 0 ? 2 : 0, it.h * hMax), cx = x + w/2;
    if(it.h != null) s += `<rect x="${x.toFixed(1)}" y="${(yb - h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${it.col}" opacity="${it.dim ? .45 : .9}"/>`;
    if(it.top != null) s += `<text x="${cx.toFixed(1)}" y="${(yb - h - 4).toFixed(1)}" font-size="10" font-weight="700" fill="var(--ink)" text-anchor="middle">${it.top}</text>`;
    s += `<text x="${cx.toFixed(1)}" y="${yb + 13}" font-size="${n > 8 ? 9 : 10}" fill="var(--muted)" text-anchor="middle">${it.label}</text>`;
    if(opt.sub && it.sub != null) s += `<text x="${cx.toFixed(1)}" y="${yb + 26}" font-size="8.5" fill="var(--muted)" text-anchor="middle">${it.sub}</text>`;
  });
  return s + `<line x1="${l}" x2="${r}" y1="${yb}" y2="${yb}" stroke="var(--muted)" stroke-width=".8"/></svg>`;
}

  const n = L.length; if(!n) return null;
  const abs = L.map(x => Math.abs(x.e)).sort((a, b) => a - b), med = n % 2 ? abs[(n-1)/2] : (abs[n/2-1] + abs[n/2]) / 2;

}

  let s = `<svg class="dist" viewBox="0 0 300 ${H}" role="img">`;
  s += `<rect x="${AX.l}" y="${top}" width="${AX.r-AX.l}" height="${base-top}" rx="6" fill="var(--bad)" opacity=".07"/>`;
  s += `<rect x="${X(-1)}" y="${top}" width="${X(1)-X(-1)}" height="${base-top}" fill="var(--mid)" opacity=".10"/>`;
  s += `<rect x="${X(-l2)}" y="${top}" width="${X(l2)-X(-l2)}" height="${base-top}" fill="var(--good)" opacity=".14"/>`;
  s += `<line x1="${X(0)}" y1="${top-4}" x2="${X(0)}" y2="${base+4}" stroke="var(--ink)" stroke-width="1.5"/>`;
  dots.forEach(d => s += `<circle cx="${d.x.toFixed(1)}" cy="${(base - (d.lvl-.5)*dy).toFixed(1)}" r="${r.toFixed(1)}" fill="${zoneCol(d.e)}" stroke="var(--card)" stroke-width=".8"/>`);
  // Durchschnitt (Kreis + Beschriftung) und Streuung (Balken ±1 SD)
  if(es.length > 1){
    const x1 = X(mean - sd), x2 = X(mean + sd), xm = X(mean), yb = 21;
    s += `<line x1="${xm}" y1="${yb+6}" x2="${xm}" y2="${base}" stroke="var(--accent)" stroke-width="1.5" opacity=".5"/>`;
    s += `<line x1="${x1}" y1="${yb}" x2="${x2}" y2="${yb}" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>`+
         `<line x1="${x1}" y1="${yb-5}" x2="${x1}" y2="${yb+5}" stroke="var(--accent)" stroke-width="2"/><line x1="${x2}" y1="${yb-5}" x2="${x2}" y2="${yb+5}" stroke="var(--accent)" stroke-width="2"/>`;
    s += `<circle cx="${xm}" cy="${yb}" r="5.5" fill="var(--card)" stroke="var(--accent)" stroke-width="3"/>`;
    const lx = Math.max(AX.l + 22, Math.min(AX.r - 22, xm));
    s += `<text x="${lx}" y="9" font-size="10" font-weight="700" fill="var(--accent)" text-anchor="middle">Ø ${fmtF(mean)}</text>`;
  }
  return s + axisSvg(sp, base + 4) + '</svg>';
}
function histogram(es, sp){
  const n = es.length;
  let k = Math.round(Math.sqrt(n) * 1.6); if(k % 2 === 0) k++; k = Math.max(5, Math.min(41, k));
  const w = 2*sp / k, bins = Array.from({length:k}, (_,i) => ({lo: -sp + i*w, hi: -sp + (i+1)*w, n: 0}));
  es.forEach(e => { const c = Math.max(-sp, Math.min(sp, e)); bins[Math.min(k-1, Math.floor((c + sp) / w))].n++; });
  const max = Math.max(...bins.map(b => b.n), 1), top = 16, hMax = 96, yb = top + hMax, gap = k > 25 ? .6 : 1.2;
  let s = `<svg class="dist" viewBox="0 0 300 ${yb + 34}" role="img">`;
  [.5, 1].forEach(f => s += `<line x1="${AX.l}" x2="${AX.r}" y1="${yb - f*hMax}" y2="${yb - f*hMax}" stroke="var(--line)" stroke-dasharray="2 3"/>`);
  s += `<text x="${AX.l}" y="${top - 4}" font-size="9" fill="var(--muted)">${max}</text>`;
  bins.forEach((b, i) => {
    const x1 = ax(b.lo, sp) + gap, x2 = ax(b.hi, sp) - gap, h = b.n / max * hMax;
    const lo = i === 0 ? '≤' + fmtF(-sp) : fmtF(b.lo), hi = i === k-1 ? '≥' + fmtF(sp) : fmtF(b.hi);
    if(b.n) s += `<rect x="${x1.toFixed(1)}" y="${(yb - h).toFixed(1)}" width="${Math.max(1, x2-x1).toFixed(1)}" height="${h.toFixed(1)}" rx="${k > 25 ? 1 : 3}" fill="var(--accent)"><title>${i===0 ? lo : i===k-1 ? hi : lo + ' … ' + hi}: ${b.n}</title></rect>`;
    if(b.n && k <= 15) s += `<text x="${((x1+x2)/2).toFixed(1)}" y="${(yb - h - 4).toFixed(1)}" font-size="9.5" font-weight="700" fill="var(--ink)" text-anchor="middle">${b.n}</text>`;
  });
  s += `<line x1="${ax(0, sp)}" y1="${top - 2}" x2="${ax(0, sp)}" y2="${yb}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/>`;
  s += `<line x1="${AX.l}" x2="${AX.r}" y1="${yb}" y2="${yb}" stroke="var(--line)" stroke-width="1.5"/>`;
  return s + axisSvg(sp, yb + 2) + '</svg>';
}

const ANCH_IDS = ANCH.map(a => Q.filter(q => a[9].some(m => q.de.text.includes(m))).map(q => q.id));

function unlockAnchors(id, pts, silent){
  if(pts < ANCH_MIN) return;
  const got = store.get('anchors', {}); let changed = false;
  ANCH.forEach((a, i) => {
    if(got[a[0]] || !ANCH_IDS[i].includes(id)) return;
    got[a[0]] = Date.now(); changed = true;
    if(!silent) toastQ.push({i: a[1], n: settings.lang === 'en' ? a[6] : a[5], l: t('anchorNew'), view: 'anchors'});
  });
  if(changed){ store.set('anchors', got); if(!silent) nextToast(); }
}

/* ── Fehler-Stapel (Karteikarten) ── */
const REV_BAD = 50, REV_OK = 75, REV_NEED = 2;
function updateRev(id, pts){
  const D = store.get('rev', {}); let st = null;
  if(D[id]){
    if(pts >= REV_OK){
      D[id].s++;
      if(D[id].s >= REV_NEED){ delete D[id]; const p = loadProg(); p.mastered++; saveProg(p); st = 'mastered'; }
      else st = 'progress';
    } else { D[id].s = 0; st = 'again'; }
    if(D[id]) D[id].t = Date.now();
  } else if(pts < REV_BAD){ D[id] = {s: 0, t: Date.now()}; st = 'added'; }
  store.set('rev', D);
  return st;
}
const revDeck = () => Object.entries(store.get('rev', {})).filter(([id]) => Q[+id])
  .sort((a, b) => a[1].s - b[1].s || a[1].t - b[1].t).map(([id]) => Q[+id]);
function startReview(){
  settleOpenGame();
  const deck = revDeck(); if(!deck.length) return home();
  game = {mode: 'review', qs: shuffle(deck.slice(0, 10)), i: 0, results: [], mastered: 0};
  ask();
}
function backfillRevAnchors(){
  if(store.get('revInit', false)) return;
  const d = store.get('daily', {});
  Object.keys(d).sort().forEach(k => (d[k] || []).forEach(r => { if(Q[r.id]){ updateRev(r.id, r.pts); unlockAnchors(r.id, r.pts, true); } }));
  store.set('revInit', true);
}

   body:['Der Physiker Enrico Fermi war berühmt dafür, scheinbar unbeantwortbare Fragen in Minuten zu schätzen. Sein Trick: Er zerlegte sie in <b>Teilfragen</b>, deren Antworten man ungefähr kennt, und multiplizierte sie.',
         'Das Schöne daran: Jeder Teil darf grob sein. Schätzt du einen Teil zu hoch und einen anderen zu niedrig, gleichen sich die Fehler oft aus.'],
   ex:['<b>Frage:</b> Wie oft schlägt ein Herz in einem ganzen Leben?','Puls etwa 70 pro Minute.','× 60 Minuten × 24 Stunden ≈ 100.000 pro Tag.','× 365 Tage ≈ 37 Millionen pro Jahr.','× 80 Jahre ≈ 3 Milliarden. <b>Richtig:</b> 3 Milliarden.'],
   sol:'Zerlegen: 83 Millionen Einwohner leben in etwa 41 Millionen Haushalten. Viele Haushalte haben ein Auto, manche zwei, Großstädter oft keins – sagen wir im Schnitt gut 1,1. Das ergibt rund 45 Millionen. Richtig sind 49 Millionen.'},
  en:{title:'Break it down (Fermi method)', tag:'Split an impossible question into small, solvable parts.',
   body:['The physicist Enrico Fermi was famous for estimating seemingly unanswerable questions in minutes. His trick: break them into <b>sub-questions</b> whose answers you roughly know, then multiply.',
         'The beauty of it: each part may be rough. If you guess one part too high and another too low, the errors often cancel out.'],
   ex:['<b>Question:</b> How many times does a heart beat in a lifetime?','Pulse about 70 per minute.','× 60 minutes × 24 hours ≈ 100,000 per day.','× 365 days ≈ 37 million per year.','× 80 years ≈ 3 billion. <b>Answer:</b> 3 billion.'],
   sol:'Break it down: Germany’s 83 million people live in about 41 million households. Many households have one car, some two, city dwellers often none – say just over 1.1 on average. That gives about 45 million. The answer is 49 million.'}},
 {id:'anchors', icon:'📌', q:'Wie schnell bewegt sich die Erde um die Sonne?',
  de:{title:'Von Ankerwerten aus rechnen', tag:'Bekannte Zahlen als Sprungbrett nutzen.',
   body:['Viele Fragen lassen sich aus wenigen Zahlen herleiten, die man einmal gelernt hat: Erdumfang, Einwohnerzahlen, Sekunden pro Jahr. Solche <b>Ankerwerte</b> sind das Werkzeug guter Schätzer.',
         'In diesem Spiel sammelst du sie unter „Erfolge → Merkzahlen“. Jede Merkzahl, die du kennst, macht Dutzende andere Fragen leichter.'],
   ex:['<b>Frage:</b> Wie viele Sekunden lebt ein Mensch, der 80 Jahre alt wird?','Anker: Ein Jahr hat etwa π × 10⁷ ≈ 31,5 Millionen Sekunden.','× 80 ≈ 2,5 Milliarden Sekunden.','<b>Richtig:</b> 2,52 Milliarden.'],
   sol:'Anker: Die Sonne ist 150 Millionen km entfernt. Die Erdbahn ist also ein Kreis mit dem Umfang 2π × 150 Mio. ≈ 940 Millionen km. Den schafft die Erde in einem Jahr, also in 8.760 Stunden: 940 Mio. ÷ 8.760 ≈ 107.000 km/h. Richtig: 107.000 km/h.'},
  en:{title:'Work from anchor numbers', tag:'Use known numbers as a springboard.',
   body:['Many questions can be derived from a handful of numbers you learn once: the Earth’s circumference, populations, seconds per year. These <b>anchor numbers</b> are the tools of good estimators.',
         'In this game you collect them under “Awards → Anchor numbers”. Every anchor you know makes dozens of other questions easier.'],
   ex:['<b>Question:</b> How many seconds does a person live who reaches 80?','Anchor: a year has about π × 10⁷ ≈ 31.5 million seconds.','× 80 ≈ 2.5 billion seconds.','<b>Answer:</b> 2.52 billion.'],
   sol:'Anchor: the Sun is 150 million km away. So Earth’s orbit is a circle with a circumference of 2π × 150 million ≈ 940 million km. Earth covers it in one year, i.e. 8,760 hours: 940 million ÷ 8,760 ≈ 107,000 km/h. The answer is 107,000 km/h.'}},
 {id:'compare', icon:'⚖️', q:'Wie groß ist die Fläche Österreichs?',
  de:{title:'Vergleichen', tag:'Unbekanntes an Bekanntem messen.',
   body:['Oft kennt man keine Zahl, aber einen <b>Vergleich</b>: „ungefähr so groß wie …“, „etwa ein Fünftel von …“. Verhältnisse schätzt man viel zuverlässiger als absolute Werte.',
         'Such dir eine Referenz, die du kennst, und frag nur noch: Wie viel größer oder kleiner ist das Gesuchte? Das funktioniert für Flächen, Höhen, Einwohner und Geldbeträge gleichermaßen.'],
   ex:['<b>Frage:</b> Wie groß ist die Fläche Bayerns?','Referenz: Deutschland hat rund 357.000 km².','Bayern ist das größte Bundesland, etwa ein Fünftel der Karte.','357.000 ÷ 5 ≈ 71.000 km². <b>Richtig:</b> 70.550 km².'],
   sol:'Referenz: Bayern mit rund 70.000 km². Österreich ist auf der Karte etwas größer als Bayern – grob 20 % mehr. Das ergibt etwa 84.000 km². Richtig: 83.879 km².'},
  en:{title:'Compare', tag:'Measure the unknown against the known.',
   body:['Often you don’t know a number, but you know a <b>comparison</b>: “about as big as …”, “roughly a fifth of …”. People estimate ratios far more reliably than absolute values.',
         'Pick a reference you know and just ask: how much bigger or smaller is the thing I want? This works equally well for areas, heights, populations and amounts of money.'],
   ex:['<b>Question:</b> What is the area of Bavaria?','Reference: Germany is about 357,000 km².','Bavaria is the largest German state, about a fifth of the map.','357,000 ÷ 5 ≈ 71,000 km². <b>Answer:</b> 70,550 km².'],
   sol:'Reference: Bavaria at about 70,000 km². On the map Austria is a little larger than Bavaria – roughly 20 % more. That gives about 84,000 km². The answer is 83,879 km².'}},
 {id:'units', icon:'🔍', q:'Wie viele Badewannen (150 l) füllt ein olympisches Schwimmbecken (2.500 m³)?',

const LESSON_Q = LESSONS.map(l => (Q.find(q => q.de.text === l.q) || {}).id);
let learnSel = null;
function showLearn(sel){
  if(sel !== undefined) learnSel = sel;
  const done = store.get('lessons', {});
  if(learnSel == null){
    $('learnH').textContent = t('learnTitle');
    $('learnBody').innerHTML = `<p class="lead">${t('learnLead')}</p><div class="lessons">` + LESSONS.map((l, i) => {
      const x = l[settings.lang], d = done[l.id];
      return `<button class="lcard" data-l="${i}"><span class="ln">${l.icon}</span><span><b>${i+1}. ${x.title}</b><small>${x.tag}</small></span>` +
        `<span class="ld" style="color:${d != null ? color(d) : 'var(--muted)'}">${d != null ? '✓ ' + d : '›'}</span></button>`;
    }).join('') + '</div>';
    $('learnBody').querySelectorAll('.lcard').forEach(b => b.onclick = () => { showLearn(+b.dataset.l); scrollTo(0, 0); });
  } else {
    const l = LESSONS[learnSel], x = l[settings.lang], q = Q[LESSON_Q[learnSel]], unit = L(q).unit;
    $('learnH').textContent = `${learnSel+1}. ${x.title}`;
    $('learnBody').innerHTML = `<button class="back" id="lBack">← ${t('allLessons')}</button><div class="lesson">` +
      x.body.map(p => `<p>${p}</p>`).join('') +
      `<div class="lbox ex"><div class="lb-t">${t('example')}</div><ol>${x.ex.map(e => `<li>${e}</li>`).join('')}</ol></div>` +
      `<div class="lbox pr"><div class="lb-t">${t('practice')}</div><p class="lq">${L(q).text}</p>` +
      (l.bounds ? `<div class="bounds"><div class="inputwrap small"><input id="lLo" inputmode="decimal" placeholder="${t('tooLowPh')}"></div>` +
        `<div class="inputwrap small"><input id="lHi" inputmode="decimal" placeholder="${t('tooHighPh')}"></div></div>` +
        `<div class="gm"><span id="lGm">${t('gmHint')}</span><button type="button" id="lGmUse" disabled>${t('gmUse')}</button></div>` : '') +
      `<form id="lForm" autocomplete="off"><div class="inputwrap" style="margin-top:8px"><input id="lGuess" inputmode="decimal" placeholder="${t('placeholder')}"><span>${unit}</span></div>` +
      `<div class="preview" id="lPrev">&nbsp;</div><button class="btn" type="submit">${t('check')}</button></form><div id="lRes" class="lres"></div></div></div>`;
    $('lBack').onclick = () => showLearn(null);
    const prev = () => {
      const v = parseNum($('lGuess').value), pv = $('lPrev'); pv.classList.remove('err');
      if(v === null) pv.innerHTML = '&nbsp;';
      else if(!(v > 0)){ pv.textContent = t('errPos'); pv.classList.add('err'); }
      else pv.textContent = '= ' + fmt(v) + ' ' + unit;
    };
    $('lGuess').oninput = prev;
    if(l.bounds){
      let gm = null;
      const upd = () => {
        const lo = parseNum($('lLo').value), hi = parseNum($('lHi').value);
        gm = lo > 0 && hi > 0 ? Math.sqrt(lo * hi) : null;
        $('lGm').textContent = gm ? `${t('gmRes')}: ${gm >= 1e6 ? fmt(gm) : nf(3).format(gm)}` : t('gmHint');
        $('lGmUse').disabled = !gm;
      };
      $('lLo').oninput = upd; $('lHi').oninput = upd;
      $('lGmUse').onclick = () => { if(gm){ $('lGuess').value = nf(3).format(gm); prev(); } };
    }
    $('lForm').onsubmit = e => {
      e.preventDefault();
      const v = parseNum($('lGuess').value);
      if(!(v > 0)){ prev(); $('lPrev').classList.add('err'); if(v === null) $('lPrev').textContent = t('errEmpty'); return; }
      const r = score(v, q.answer), d = store.get('lessons', {});
      d[l.id] = Math.max(d[l.id] ?? 0, r.pts); store.set('lessons', d);
      const last = learnSel === LESSONS.length - 1;
      $('lRes').innerHTML = `<div class="result"><div class="points" style="color:${color(r.pts)}">+${r.pts}</div><div class="verdict">${verdict(r)}</div></div>` +
        `<div class="cmp"><div><small>${t('yourGuess')}</small><strong>${fmt(v)} ${unit}</strong></div><div><small>${t('correct')}</small><strong>${fmt(q.answer)} ${unit}</strong></div></div>` +
        `<div class="sol"><b>${t('howTo')}</b> ${x.sol}</div>` +
        `<div class="stack"><button class="btn" id="lNext">${last ? t('toOverview') : t('nextLesson')}</button><button class="btn2" id="lAgain">${t('tryAgain')}</button></div>`;
      $('lForm').classList.add('hidden');
      $('lNext').onclick = () => { showLearn(last ? null : learnSel + 1); scrollTo(0, 0); };
      $('lAgain').onclick = () => showLearn(learnSel);
      $('lRes').scrollIntoView({behavior: 'smooth', block: 'start'});
      checkAch();
    };
  }
  show('vLearn'); setTab('learn');
}

const PROG0 = {clutch:0, early:0, pow10:0, mastered:0, good:0, bestGood:0, hit:0, bestHit:0, perfect:0, bestStreak:0, longestEndless:0, bestGame:0, wild:0, huge:0, owl:0, blitzGames:0, blitzBest:0, blitzClean:0, quick:0, buzzer:0, langs:{}};
function loadProg(){ const p = store.get('prog', PROG0); for(const k in PROG0) if(k !== 'langs') p[k] = fin(p[k]); p.langs = p.langs || {}; return p; }
const saveProg = p => store.set('prog', p);
function trackAnswer(v, r){
  const p = loadProg();
  p.good = r.pts >= 80 ? p.good + 1 : 0; p.bestGood = Math.max(p.bestGood, p.good);
  p.hit = r.factor < 1.05 ? p.hit + 1 : 0; p.bestHit = Math.max(p.bestHit, p.hit);
  if(r.factor >= 100) p.wild = 1;
  if(v >= 1e18) p.huge = 1;
  const hr = new Date().getHours();
  if(hr < 4) p.owl = 1;
  if(hr >= 5 && hr < 7) p.early = 1;
  const l10 = Math.round(Math.log10(v));
  if(r.pts >= 80 && Math.abs(v - 10 ** l10) < 1e-9 * v) p.pow10 = 1;
  if(game.mode === 'survival' && game.lives === 1 && r.pts >= LIFE_THRESHOLD){ game.clutch = (game.clutch || 0) + 1; p.clutch = Math.max(p.clutch, game.clutch); }
  p.langs[settings.lang] = 1;
  const sc = game.last && game.last.secs;
  if(sc != null){
    if(r.pts >= 80 && sc < 3) p.quick = 1;
    if(r.pts >= 70 && !game.last.auto && settings.blitzSec - sc < 1) p.buzzer = 1;
  }
  if(game.mode === 'endless') p.longestEndless = Math.max(p.longestEndless, game.results.length);
  p.bestGame = Math.max(p.bestGame, total());
  saveProg(p);
}
function seenInfo(){
  const ids = new Set();
  store.get('log', []).forEach(x => { if(x.i != null) ids.add(x.i); });
  Object.values(store.get('daily', {})).forEach(rs => (rs || []).forEach(r => ids.add(r.id)));
  return {distinct: ids.size, completeCats: cats.filter(c => Q.every(q => q.cat !== c || ids.has(q.id))).length};
}
function achCtx(){
  const cs = store.get('cats', {}), st = loadStats(), en = store.get('endless', {best:0, bestN:0}), p = loadProg();
  const per = cats.map(c => cs[c]).filter(Boolean);
  return {
    answers: per.reduce((a,c)=>a+c.n,0), hits: per.reduce((a,c)=>a+c.hits,0),
    catsPlayed: per.filter(c => c.n > 0).length,
    anchors: Object.keys(store.get('anchors', {})).length,
    masterN: per.filter(c => c.n >= 10 && c.sum/c.n >= 70).length,
    lessons: Object.keys(store.get('lessons', {})).length,
    ...seenInfo(),
    master: per.some(c => c.n >= 10 && c.sum/c.n >= 70) ? 1 : 0,
    allround: per.filter(c => c.n >= 5 && c.sum/c.n >= 50).length,
    daily: Object.keys(store.get('daily', {})).length,
    streak: Math.max(p.bestStreak, st.streak), games: st.games, survN: fin(en.bestN), p
  };
}

const achText = a => settings.lang === 'en' ? a[5] : a[4];
let toastQ = [], toastBusy = false;
function checkAch(silent){
  const got = store.get('ach', {}), c = achCtx(), newly = [];
  ACH.forEach(a => { if(!got[a[0]] && a[3](c) >= a[2]){ got[a[0]] = Date.now(); newly.push(a); } });
  if(!newly.length) return;
  store.set('ach', got);
  if(!silent){ toastQ.push(...newly.map(a => ({i: a[1], n: achText(a)[0], l: t('achNew'), view: 'ach'}))); nextToast(); }
}
function nextToast(){
  if(toastBusy || !toastQ.length) return;
  const el = $('toast'); toastBusy = true;
  let view;
  if(toastQ.length >= 3){
    const all = toastQ.splice(0); view = all[0].view;
    el.innerHTML = `<span class="ti">🏆</span><span><small>${t('achMany', all.length)}</small><b>${all.map(x => x.i).join(' ')}</b></span>`;
  } else {
    const x = toastQ.shift(); view = x.view;
    el.innerHTML = `<span class="ti">${x.i}</span><span><small>${x.l}</small><b>${x.n}</b></span>`;
  }
  el.onclick = () => { el.classList.remove('on'); showAch(view); };
  requestAnimationFrame(() => el.classList.add('on'));
  setTimeout(() => { el.classList.remove('on'); setTimeout(() => { toastBusy = false; nextToast(); }, 450); }, 2800);
}
function achHtml(){
  const got = store.get('ach', {}), c = achCtx();
  const fmtD = ts => new Date(ts).toLocaleDateString(t('locale'), {day:'numeric', month:'short', year:'numeric'});
  const list = ACH.map(a => ({a, ts: got[a[0]], v: Math.min(a[2], a[3](c))}))
    .sort((x,y) => (!!y.ts - !!x.ts) || (x.ts && y.ts ? y.ts - x.ts : y.v/y.a[2] - x.v/x.a[2]));
  const u = list.filter(x => x.ts).length;
  return `<div class="achsum"><p class="lead" style="margin:0">${t('achLead', u, ACH.length)}</p>
      <div class="meter"><i style="width:${u/ACH.length*100}%;background:var(--accent)"></i></div></div>
    <div class="achgrid">${list.map(({a, ts, v}) => {
      const [name, desc] = achText(a);
      return `<div class="ach ${ts ? 'got' : 'locked'}"><span class="ai">${a[1]}</span><b>${name}</b><p>${desc}</p>` +

            : a[2] > 1 ? `<small>${nf(6).format(v)} / ${nf(6).format(a[2])}</small><div class="meter"><i style="width:${v/a[2]*100}%;background:var(--accent)"></i></div>` : '') + '</div>';

/* ── CSV-Export / -Import ── */
const BACKUP_FORMAT = 'schaetzmeister-1';
const BACKUP_KEYS = {settings:'o', stats:'o', cats:'o', log:'a', daily:'o', dailyProg:'o', active:'o', seen:'a', endless:'o', blitz:'o',
  rev:'o', anchors:'o', ach:'o', prog:'o', lessons:'o', logInit:'b', revInit:'b', catSel:'a'};
const csvCell = v => '"' + String(v).replace(/"/g, '""') + '"';
function parseCsv(text){
  const rows = []; let row = [], cell = '', q = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(q){
      if(c === '"'){ if(text[i+1] === '"'){ cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if(c === '"') q = true;
    else if(c === ','){ row.push(cell); cell = ''; }
    else if(c === '\n' || c === '\r'){
      if(c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); cell = ''; if(row.some(x => x !== '')) rows.push(row); row = [];
    } else cell += c;
  }
  row.push(cell); if(row.some(x => x !== '')) rows.push(row);
  return rows;
}
function exportCsv(){
  const rows = [['key','value'], ['format', BACKUP_FORMAT], ['exported', new Date().toISOString()]];
  for(const k in BACKUP_KEYS){ let raw = null; try{ raw = localStorage.getItem('sm_'+k); }catch(e){} if(raw !== null && raw !== 'null') rows.push([k, raw]); }
  const csv = '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n') + '\r\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  a.download = `schaetzmeister-${today()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  $('dataMsg').textContent = t('csvExported', rows.length - 3);
}
async function importCsv(file){
  const msg = $('dataMsg'), bad = () => { msg.textContent = t('csvBad'); };
  let rows;
  try{ rows = parseCsv((await file.text()).replace(/^\ufeff/, '')); }catch(e){ return bad(); }
  if(!rows.length || rows[0][0] !== 'key' || rows[0][1] !== 'value') return bad();
  const fmt = rows.find(r => r[0] === 'format');
  if(!fmt || fmt[1] !== BACKUP_FORMAT) return bad();
  const data = {};
  for(const [k, v] of rows.slice(1)){
    const kind = BACKUP_KEYS[k]; if(!kind || v === undefined) continue;
    let x; try{ x = JSON.parse(v); }catch(e){ return bad(); }
    if(x === null) continue;
    const ok = kind === 'a' ? Array.isArray(x) : kind === 'b' ? typeof x === 'boolean' : (x && typeof x === 'object' && !Array.isArray(x));
    if(!ok) return bad();
    data[k] = v;
  }
  const n = Object.keys(data).length;
  if(!n) return bad();
  if(!confirm(t('csvConfirm', n))) return;
  try{
    for(const k in BACKUP_KEYS) localStorage.removeItem('sm_'+k);
    for(const k in data) localStorage.setItem('sm_'+k, data[k]);
  }catch(e){ return bad(); }
  msg.textContent = t('csvImported');
  setTimeout(() => location.reload(), 600);
}
